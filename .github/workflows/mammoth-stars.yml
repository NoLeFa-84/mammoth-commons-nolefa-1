name: "sum all related software stars"
on:
  push:
    branches: [dev]
  schedule:
    - cron: "0 0 * * *"
permissions:
  contents: write
jobs:
  build-badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install --quiet --upgrade pip
      - name: Calculate total stars & generate badge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPOS=(
            "mammoth-eu/mammoth-commons"
            "mammoth-eu/mammoth-toolkit-releases"
            "mever-team/FairBench"
            "arjunroyihrpa/MMM_fair"
            "arjunroyihrpa/FairBranch"
            "arjunroyihrpa/Multi-Fairness-under-Class-Imbalance"
            "mever-team/fairbench-tiny"
            "mever-team/vb-mitigator"
            "gsarridis/faceX"
            "gebaltso/SDFD"
            "CSHVienna/hyper_fair"
            "CSHVienna/multisoc"
            "MKLab-ITI/pygrank-f"
          )
          python config/sum_stars.py "${REPOS[@]}"
      - name: Commit badge if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stars-mammoth-badge.svg
          if git diff --cached --quiet; then
            echo "✅ No changes to badge."
          else
            TOTAL=$(grep -o '>[0-9]\+<' stars-mammoth-badge.svg | tr -d '<>')
            git commit -m "Updated stars badge (total = $TOTAL)"
            git push
          fi
      
