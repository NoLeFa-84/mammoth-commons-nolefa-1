name: Integration tests

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        lfs: false  # Disable LFS

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install coverage black radon
        python -m pip install -r config/requirements[mai].txt

    - name: Run tests
      run: |
        python integration_tests.py

    - name: Generate catalogue
      run: |
        python -m docs.generate

    - name: Coverage check
      run: |
        coverage xml -o coverage.xml
        coverage report --fail-under=60

    - name: Coverage badge
      if: github.event_name == 'push'  # Only run on push, not pull_request
      run: |
        COVERAGE_PERCENT=$(coverage report | grep 'TOTAL' | awk '{print $4}' | sed 's/%//')
        curl -o coverage-badge.svg https://img.shields.io/badge/Coverage-${COVERAGE_PERCENT}%25-brightgreen
        sed -i 's#!\[Coverage\](.*)#![Coverage](./coverage-badge.svg)#' README.md
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add coverage-badge.svg README.md
        git add docs/*.html
        if git diff --cached --exit-code; then
          echo "No changes to commit."
        else
          git commit -m "Update coverage and docs"
          git push
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Use GITHUB_TOKEN for authentication

    - name: Deploy GitHub Pages
      if: github.event_name == 'push'  # Only run on push, not pull_request
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs

    - name: Radon complexity report
      run: |
          echo "Running Radon cyclomatic complexity analysis..."
          radon cc mai_bias/catalogue/ -s -a
          AVG_LINE=$(radon cc mai_bias/catalogue/ -s -a | tail -n 1)
          GRADE=$(echo "$AVG_LINE" | awk '{print $3}')
          case "$GRADE" in
           A|B|C)
             echo "Complexity grade acceptable: $GRADE"
             ;;
           *)
             echo "Complexity grade too low: $GRADE"
             exit 1
             ;;
          esac